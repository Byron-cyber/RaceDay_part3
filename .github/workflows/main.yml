name: RaceDay - Build and Test


on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Build API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build MVC web app
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build MVC Docker image
        run: docker build -f RaceDay.Web/Dockerfile -t raceday-web:ci .
